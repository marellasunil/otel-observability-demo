apiVersion: v1
kind: Namespace
metadata:
  name: demo-apps
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-observability-demo
  namespace: demo-apps
spec:
  replicas: 1
  selector:
    matchLabels:
      app: otel-observability-demo
  template:
    metadata:
      labels:
        app: otel-observability-demo
    spec:
      containers:
        - name: api
          image: otel-observability-demo:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: OTEL_SERVICE_NAME
              value: otel-observability-demo
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://otel-gateway.observability.svc.cluster.local:4317
            - name: DEPLOYMENT_ENVIRONMENT
              value: homelab
            - name: OTEL_PYTHON_FASTAPI_EXCLUDED_URLS
              value: health
            - name: LANGFUSE_BASE_URL
              value: https://cloud.langfuse.com
            - name: LANGFUSE_PUBLIC_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: public-key
            - name: LANGFUSE_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: langfuse-credentials
                  key: secret-key
          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 60
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 60
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            runAsNonRoot: true
            seccompProfile:
              type: RuntimeDefault
---
apiVersion: v1
kind: Service
metadata:
  name: otel-observability-demo
  namespace: demo-apps
spec:
  selector:
    app: otel-observability-demo
  ports:
    - port: 8000
      targetPort: 8000
