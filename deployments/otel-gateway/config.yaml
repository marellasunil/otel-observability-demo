# Gateway dual-export: all received metrics, logs and traces to OSS and Grafana Cloud.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318
processors:
  memory_limiter:
    check_interval: 5s
    limit_mib: 384
    spike_limit_mib: 96
  batch:
    timeout: 5s
    send_batch_size: 1024
  transform/metric_labels:
    error_mode: ignore
    metric_statements:
    - context: datapoint
      statements:
      - set(attributes["host_name"], resource.attributes["host.name"]) where resource.attributes["host.name"]
        != nil
      - set(attributes["deployment_environment_name"], resource.attributes["deployment.environment.name"])
        where resource.attributes["deployment.environment.name"] != nil
exporters:
  otlphttp/loki:
    endpoint: http://loki.observability.svc.cluster.local:3100/otlp
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: false
  prometheusremotewrite/mimir:
    endpoint: http://mimir.observability.svc.cluster.local:9009/api/v1/push
    tls:
      insecure: true
  otlp_grpc/tempo:
    endpoint: tempo.observability.svc.cluster.local:4317
    tls:
      insecure: true
  otlphttp/grafana_cloud:
    endpoint: https://otlp-gateway-prod-eu-west-2.grafana.net/otlp
    auth:
      authenticator: basicauth/grafana_cloud
    timeout: 10s
  otlphttp/splunk_o11y:
    metrics_endpoint: https://ingest.eu0.observability.splunkcloud.com/v2/datapoint/otlp
    traces_endpoint: https://ingest.eu0.observability.splunkcloud.com/v2/trace/otlp
    headers:
      X-SF-Token: ${env:SPLUNK_ACCESS_TOKEN}
    timeout: 30s
    sending_queue:
      enabled: true
      queue_size: 1000
    retry_on_failure:
      enabled: true

service:
  telemetry:
    metrics:
      level: detailed
      readers:
      - pull:
          exporter:
            prometheus:
              host: 0.0.0.0
              port: 8888
  pipelines:
    metrics:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - transform/metric_labels
      - batch
      exporters:
      - prometheus
      - prometheusremotewrite/mimir
      - otlphttp/grafana_cloud
      - otlphttp/splunk_o11y
    logs:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - batch
      exporters:
      - otlphttp/loki
      - otlphttp/grafana_cloud
    traces:
      receivers:
      - otlp
      processors:
      - memory_limiter
      - batch
      exporters:
      - otlp_grpc/tempo
      - otlphttp/grafana_cloud
      - otlphttp/splunk_o11y
  extensions:
  - basicauth/grafana_cloud
extensions:
  basicauth/grafana_cloud:
    client_auth:
      username: '1157198'
      password: ${env:GRAFANA_CLOUD_TOKEN}
